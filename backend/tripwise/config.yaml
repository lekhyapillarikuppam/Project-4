# Every tunable of the Tripwise engine (002 Spec §10 and addendum; NFR-009, ENG-FR-09).
# Times are HH:MM (IST); money is rupees; durations are minutes unless named _s or _h.

data_dir: "../../data/curated"   # relative to this file

day_start: "09:00"
day_end_cap: "23:00"
usable_budget_share: 0.90

pace:
  relaxed:  {max: 3, fill: 0.75}
  balanced: {max: 4, fill: 0.90}
  packed:   {max: 6, fill: 1.00}

lunch: {min_window_h: 6, minutes: 60, earliest: "12:30", latest: "14:30"}

# Journeys (002 Spec §4.2–4.3)
overnight_min_minutes: 480
max_surface_minutes: 1200
flight_overhead_minutes: 90
surface_depart: "06:00"
flight_depart: "07:00"
overnight_arrive: "07:00"
overnight_depart: "21:00"
return_deadline: "23:00"
arrival_buffer_minutes: 30        # day 1 starts this long after a daytime arrival
overnight_arrival_buffer_minutes: 60
departure_buffer_minutes: 30      # day D ends this long before leaving the centre
min_activity_window_minutes: 60   # a shorter day window has no activities

chain_factor: 0.6

value:
  kappa_t: 15
  beta_pref_mode: 5
  mu_travel_per_min: 0.05
  secondary_tag: 0.6
  base_share: 0.2
  crowd: {high: 0.7, medium: 0.85}

variety_share: 0.4
variety_min: 2

cpsat: {time_limit_s: 0.4, workers: 1, seed: 42}
routing_time_limit_s: 1.0
routing_metaheuristic: GUIDED_LOCAL_SEARCH
routing_solution_limit: 50
max_feedback_iters: 3
max_repairs: 20
min_budget_round: 500

local_mode: {budget: auto, mid: cab, premium: cab}

variants:
  kappa_h: 160
  tier_value: {budget: 0, mid: 0.5, premium: 1}
  lambda: 4.0
  rho: 0.7
  difference: 0.30
  saver_retries: 2

near_miss_count: 5
tradeoff_factors: [0.8, 0.9, 1.1, 1.2]

# API (Feature 004)
api:
  max_concurrent_solves: 2
  solve_wait_s: 20
  jwt_days: 7
  password_len: [8, 128]
  trip_days: [2, 7]
  people: [1, 6]
  hours_out: [4, 14]
  budget_min_per_person: 2000
  budget_max_total: 1000000
  max_days_ahead: 365
  db_pool: {min: 1, max: 5}

# AI layer (Feature 007). The model is chosen from GET https://api.groq.com/openai/v1/models (Changelog).
groq:
  base_url: "https://api.groq.com/openai/v1"
  model: "openai/gpt-oss-120b"
  timeout_s: 10
  rate_limit_wait_s: 5
  temperature_tools: 0.2
  temperature_explain: 0.4
  temperature_parse: 0.2
  max_tokens: 1200
  reasoning_effort: "low"     # gpt-oss: reasoning tokens count against max_tokens; "low" leaves room for the answer
chat:
  rate_per_hour: 30            # per user (AI-FR-07); 429 beyond this
  history_messages: 6          # earlier chat messages sent with each tool call
  name_match_cutoff: 0.6       # fuzzy activity-name match: minimum similarity
  name_match_margin: 0.1       # best match must beat the next by this much, else ask which one
  default_class: {train: "3A", bus: "ACS", flight: "Y"}   # set_transport without a class
